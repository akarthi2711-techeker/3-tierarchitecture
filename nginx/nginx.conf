# ============================================================
# aws-event-platform / nginx/nginx.conf
# Nginx configuration for the Web EC2 tier.
# Serves both portal frontends and proxies API calls to the
# respective backend Flask applications via the Internal ALB.
#
# Supports two routing modes:
#   1. PATH-BASED  (single domain, /event and /results prefixes)
#   2. HOST-BASED  (events.example.com / results.example.com)
#
# The host-based blocks are commented out by default.
# Uncomment the appropriate section for your deployment.
# ============================================================

# Number of worker processes – auto-detect CPU cores
worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # Performance
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript
                       text/xml application/xml application/xml+rss text/javascript;

    # Security headers applied to all responses
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ──────────────────────────────────────────────────────────
    # Internal ALB upstream definitions
    # Replace INTERNAL_ALB_DNS with your actual internal ALB DNS.
    # ──────────────────────────────────────────────────────────
    upstream event_backend {
        server INTERNAL_ALB_DNS:5001;
        keepalive 8;
    }

    upstream result_backend {
        server INTERNAL_ALB_DNS:5002;
        keepalive 8;
    }

    # ══════════════════════════════════════════════════════════
    # MODE 1 – PATH-BASED ROUTING  (default)
    # Single domain: example.com
    #   /event/*        → Event Portal frontend
    #   /event/api/*    → Event Portal backend (port 5001)
    #   /results/*      → Student Result Portal frontend
    #   /results/api/*  → Student Result Portal backend (port 5002)
    # ══════════════════════════════════════════════════════════
    server {
        listen 80 default_server;
        server_name _;

        # Redirect HTTP → HTTPS in production (uncomment when ACM cert is ready)
        # return 301 https://$host$request_uri;

        # Health-check for Internet-facing ALB
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ── Event Portal ──────────────────────────────────────
        # API proxy  →  Flask on port 5001
        location /event/api/ {
            proxy_pass         http://event_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # Static frontend files
        location /event/ {
            alias  /var/www/event-portal/;
            index  index.html;
            try_files $uri $uri/ /event/index.html;
        }

        # ── Student Result Portal ─────────────────────────────
        # API proxy  →  Flask on port 5002
        location /results/api/ {
            proxy_pass         http://result_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # Static frontend files
        location /results/ {
            alias  /var/www/student-result-portal/;
            index  index.html;
            try_files $uri $uri/ /results/index.html;
        }

        # Default – redirect root to event portal
        location = / {
            return 302 /event/;
        }
    }

    # ══════════════════════════════════════════════════════════
    # MODE 2 – HOST-BASED ROUTING  (uncomment to use)
    # events.example.com  → Event Portal
    # results.example.com → Student Result Portal
    # ══════════════════════════════════════════════════════════

