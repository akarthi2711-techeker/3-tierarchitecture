# ============================================================
# aws-event-platform / nginx/nginx.conf
# Event Registration Portal only — single AZ configuration
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;

    server {
        listen 80 default_server;
        server_name _;

        # Health check for ALB
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # Event Portal API → App EC2 Flask port 5001
        location ^~ /event/api/ {
            proxy_pass http://APP_EC2_PRIVATE_IP:5001/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Event Portal Frontend
        location /event/ {
            alias /var/www/event-portal/;
            index index.html;
            try_files $uri $uri/ /event/index.html;
        }

        # Redirect root to Event Portal
        location = / {
            return 302 /event/;
        }
    }
}
