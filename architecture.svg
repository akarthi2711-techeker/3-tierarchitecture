<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="1000" viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="1000" fill="#f0f4f8" rx="0"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a237e">AWS Event Platform — Three-Tier Architecture</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#546e7a">ap-south-1 (Mumbai) | Event Registration Portal</text>

  <!-- ═══ INTERNET ═══ -->
  <rect x="360" y="80" width="180" height="50" rx="10" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="450" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🌐 INTERNET</text>
  <text x="450" y="118" text-anchor="middle" font-size="11" fill="#bbdefb">End Users / Students</text>

  <!-- Arrow: Internet → IGW -->
  <line x1="450" y1="130" x2="450" y2="158" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- ═══ INTERNET GATEWAY ═══ -->
  <rect x="330" y="158" width="240" height="44" rx="8" fill="#0288d1" stroke="#01579b" stroke-width="2"/>
  <text x="450" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🔗 Internet Gateway</text>
  <text x="450" y="193" text-anchor="middle" font-size="10" fill="#e1f5fe">aws-event-platform-igw</text>

  <!-- Arrow: IGW → Internet ALB -->
  <line x1="450" y1="202" x2="450" y2="230" stroke="#0288d1" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- ═══ INTERNET-FACING ALB ═══ -->
  <rect x="150" y="230" width="600" height="56" rx="10" fill="#7b1fa2" stroke="#4a148c" stroke-width="2"/>
  <text x="450" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="white">⚖️ Internet-Facing Application Load Balancer</text>
  <text x="450" y="270" text-anchor="middle" font-size="10" fill="#e1bee7">internet-alb-1137595128.ap-south-1.elb.amazonaws.com  |  HTTP :80  |  Frontend-ALB-SG</text>

  <!-- Arrow: Internet ALB → VPC -->
  <line x1="450" y1="286" x2="450" y2="314" stroke="#7b1fa2" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

  <!-- ═══ VPC BOX ═══ -->
  <rect x="30" y="314" width="840" height="610" rx="16" fill="none" stroke="#1a237e" stroke-width="2.5" stroke-dasharray="10,4"/>
  <text x="60" y="338" font-size="13" font-weight="bold" fill="#1a237e">VPC: aws-event-platform-vpc  (10.0.0.0/16)</text>

  <!-- ═══ AZ BOX ═══ -->
  <rect x="55" y="348" width="790" height="564" rx="12" fill="none" stroke="#37474f" stroke-width="2" stroke-dasharray="7,3"/>
  <text x="80" y="368" font-size="12" font-weight="bold" fill="#37474f">Availability Zone: ap-south-1a</text>

  <!-- ═══ PUBLIC SUBNET ═══ -->
  <rect x="75" y="378" width="360" height="180" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="255" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">PUBLIC SUBNET  10.0.1.0/24</text>

  <!-- Web Server box -->
  <rect x="90" y="410" width="200" height="120" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="2"/>
  <text x="190" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">🖥 Web-Server-AZ1</text>
  <text x="190" y="450" text-anchor="middle" font-size="10" fill="#388e3c">Amazon Linux 2023</text>
  <text x="190" y="466" text-anchor="middle" font-size="10" fill="#388e3c">Nginx 1.30.4</text>
  <text x="190" y="482" text-anchor="middle" font-size="10" fill="#388e3c">HTML / CSS / JS</text>
  <text x="190" y="498" text-anchor="middle" font-size="10" fill="#546e7a">10.0.1.226  |  t3.micro</text>
  <text x="190" y="514" text-anchor="middle" font-size="10" fill="#546e7a">WebServer-SG</text>
  <text x="190" y="530" text-anchor="middle" font-size="9" fill="#81c784">EIP: 13.232.97.157</text>

  <!-- NAT Gateway box -->
  <rect x="310" y="410" width="110" height="90" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="365" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">NAT GW</text>
  <text x="365" y="450" text-anchor="middle" font-size="9" fill="#f57c00">NAT-GW</text>
  <text x="365" y="466" text-anchor="middle" font-size="9" fill="#f57c00">EIP: 15.252.38.116</text>
  <text x="365" y="482" text-anchor="middle" font-size="9" fill="#f57c00">Outbound only</text>
  <text x="365" y="498" text-anchor="middle" font-size="9" fill="#f57c00">for Private EC2</text>

  <!-- ═══ PRIVATE APP SUBNET ═══ -->
  <rect x="75" y="580" width="360" height="150" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="255" y="600" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">PRIVATE SUBNET (App)  10.0.3.0/24</text>

  <!-- App Server box -->
  <rect x="90" y="612" width="200" height="100" rx="8" fill="#ffffff" stroke="#1976d2" stroke-width="2"/>
  <text x="190" y="634" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">⚙️ App-Server-AZ1</text>
  <text x="190" y="652" text-anchor="middle" font-size="10" fill="#1565c0">Amazon Linux 2023</text>
  <text x="190" y="668" text-anchor="middle" font-size="10" fill="#1565c0">Python 3 + Flask 3.0.3</text>
  <text x="190" y="684" text-anchor="middle" font-size="10" fill="#1565c0">Port 5001</text>
  <text x="190" y="700" text-anchor="middle" font-size="10" fill="#546e7a">10.0.3.248  |  t3.micro</text>
  <text x="190" y="714" text-anchor="middle" font-size="9" fill="#546e7a">AppServer-SG  |  No Public IP</text>

  <!-- ═══ PRIVATE DB SUBNET ═══ -->
  <rect x="75" y="752" width="360" height="148" rx="10" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="255" y="772" text-anchor="middle" font-size="11" font-weight="bold" fill="#b71c1c">PRIVATE SUBNET (DB)  10.0.5.0/24</text>

  <!-- RDS box -->
  <rect x="90" y="784" width="330" height="98" rx="8" fill="#ffffff" stroke="#e53935" stroke-width="2"/>
  <text x="255" y="806" text-anchor="middle" font-size="12" font-weight="bold" fill="#b71c1c">🗄 RDS MySQL 8.0</text>
  <text x="255" y="824" text-anchor="middle" font-size="10" fill="#c62828">database-1.cpye66uo6s08.ap-south-1.rds.amazonaws.com</text>
  <text x="255" y="840" text-anchor="middle" font-size="10" fill="#c62828">db.t3.micro  |  20 GB gp2  |  Single AZ</text>
  <text x="255" y="856" text-anchor="middle" font-size="10" fill="#c62828">Database: aws_event_platform</text>
  <text x="255" y="872" text-anchor="middle" font-size="10" fill="#546e7a">Table: event_registrations  |  Database-SG</text>

  <!-- ═══ INTERNAL ALB (right side) ═══ -->
  <rect x="480" y="490" width="340" height="270" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="650" y="514" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">⚖️ Internal ALB</text>
  <text x="650" y="530" text-anchor="middle" font-size="9" fill="#ef6c00">internal-Internal-ALB-1620827242</text>
  <text x="650" y="546" text-anchor="middle" font-size="9" fill="#ef6c00">.ap-south-1.elb.amazonaws.com</text>
  <text x="650" y="562" text-anchor="middle" font-size="10" fill="#e65100">Scheme: Internal  |  Backend-ALB-SG</text>

  <!-- Routing rule box -->
  <rect x="496" y="572" width="308" height="44" rx="6" fill="#fff3e0" stroke="#ffb300" stroke-width="1.5"/>
  <text x="650" y="590" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">Listener Rule: HTTP :80</text>
  <text x="650" y="606" text-anchor="middle" font-size="10" fill="#ef6c00">Path /api/*  →  Event-API-TG</text>

  <!-- Target Group -->
  <rect x="496" y="628" width="308" height="60" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="650" y="647" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">Event-API-TG</text>
  <text x="650" y="663" text-anchor="middle" font-size="10" fill="#2e7d32">Port: 5001  |  Health: GET /api/health</text>
  <text x="650" y="679" text-anchor="middle" font-size="10" fill="#2e7d32">Target: App-Server-AZ1  ✅ Healthy</text>

  <!-- Web Target Group -->
  <rect x="496" y="700" width="308" height="44" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
  <text x="650" y="719" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a237e">Web-TG</text>
  <text x="650" y="735" text-anchor="middle" font-size="10" fill="#283593">Port: 80  |  Target: Web-Server-AZ1  ✅</text>

  <!-- ═══ SECURITY GROUP LEGEND (bottom right) ═══ -->
  <rect x="480" y="760" width="340" height="140" rx="10" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="650" y="780" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">🔒 Security Groups</text>
  <text x="496" y="800" font-size="9" fill="#6a1b9a">Frontend-ALB-SG : 80,443 ← Internet</text>
  <text x="496" y="816" font-size="9" fill="#6a1b9a">WebServer-SG    : 80 ← Frontend-ALB-SG</text>
  <text x="496" y="832" font-size="9" fill="#6a1b9a">Backend-ALB-SG  : 5001 ← WebServer-SG</text>
  <text x="496" y="848" font-size="9" fill="#6a1b9a">AppServer-SG    : 5001 ← Backend-ALB-SG</text>
  <text x="496" y="864" font-size="9" fill="#6a1b9a">Database-SG     : 3306 ← AppServer-SG</text>
  <text x="496" y="880" font-size="9" fill="#880e4f">⚠ RDS port 3306 NEVER exposed to Internet</text>

  <!-- ═══ CONNECTING ARROWS ═══ -->

  <!-- Internet ALB → Web EC2 -->
  <line x1="350" y1="314" x2="280" y2="410" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>
  <text x="290" y="368" font-size="9" fill="#7b1fa2">HTTP :80</text>
  <text x="282" y="380" font-size="9" fill="#7b1fa2">Web-TG</text>

  <!-- Web EC2 → Internal ALB (proxy) -->
  <line x1="290" y1="470" x2="480" y2="570" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="355" y="510" font-size="9" fill="#1565c0">proxy_pass</text>
  <text x="348" y="522" font-size="9" fill="#1565c0">/event/api/</text>

  <!-- Internal ALB → App EC2 -->
  <line x1="480" y1="650" x2="290" y2="660" stroke="#f57c00" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="370" y="645" font-size="9" fill="#f57c00">Event-API-TG</text>

  <!-- App EC2 → RDS -->
  <line x1="190" y1="712" x2="190" y2="784" stroke="#c62828" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="196" y="752" font-size="9" fill="#c62828">MySQL :3306</text>

  <!-- NAT → Internet (outbound) -->
  <path d="M 365 410 C 365 350 700 350 700 286" stroke="#f57c00" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <text x="550" y="345" font-size="9" fill="#f57c00">Outbound (pip/dnf)</text>

  <!-- ═══ ARROW MARKERS ═══ -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0288d1"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7b1fa2"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f57c00"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
    </marker>
  </defs>

  <!-- ═══ TECH STACK FOOTER ═══ -->
  <rect x="30" y="936" width="840" height="50" rx="8" fill="#1a237e"/>
  <text x="450" y="956" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Tech Stack</text>
  <text x="450" y="974" text-anchor="middle" font-size="10" fill="#90caf9">Flask 3.0 · MySQL 8.0 · Nginx 1.30 · Amazon EC2 t3.micro · Amazon RDS · Amazon ALB · Amazon VPC</text>

</svg>
